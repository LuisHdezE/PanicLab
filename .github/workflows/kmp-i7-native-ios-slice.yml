name: KMP I7 Native iOS Slice

on:
  pull_request:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - '.github/workflows/kmp-i7-native-ios-slice.yml'
      - 'app/src/main/assets/paniclab_rules_v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ios-slice:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Record Apple toolchain
        run: |
          set -euo pipefail
          uname -a
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Link Shared frameworks
        run: |
          set -euo pipefail
          ./gradlew \
            :shared:linkDebugFrameworkIosArm64 \
            :shared:linkDebugFrameworkIosSimulatorArm64 \
            --stacktrace

      - name: Build native SwiftUI app for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/PanicLabIOS.xcodeproj \
            -scheme PanicLabIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build native SwiftUI app for device without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/PanicLabIOS.xcodeproj \
            -scheme PanicLabIOS \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select and boot iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          candidates = []
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name','').startswith('iPhone'):
                      candidates.append((runtime, device['name'], device['udid']))
          if not candidates:
              raise SystemExit('No available iPhone simulator found')
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run native unit and accessibility UI smoke tests
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/PanicLabIOS.xcresult"
          xcodebuild \
            -project iosApp/PanicLabIOS.xcodeproj \
            -scheme PanicLabIOS \
            -configuration Debug \
            -destination 'id=${{ steps.simulator.outputs.udid }}' \
            -resultBundlePath "$RUNNER_TEMP/PanicLabIOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Archive XCTest result bundle
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-artifacts"
          if [ -d "$RUNNER_TEMP/PanicLabIOS.xcresult" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$RUNNER_TEMP/PanicLabIOS.xcresult" \
              "$GITHUB_WORKSPACE/ci-artifacts/PanicLabIOS.xcresult.zip"
          fi

      - name: Upload XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paniclab-i7-ios-xcresult
          path: ci-artifacts/PanicLabIOS.xcresult.zip
          retention-days: 7
          if-no-files-found: warn
