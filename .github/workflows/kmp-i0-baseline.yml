name: KMP I0 Baseline Verification

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/features/paniclab-kmp-migration/I0_BASELINE_FREEZE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-i0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline fixtures and architecture guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Validate frozen JSON fixtures
        shell: bash
        run: |
          python3 -m json.tool migration-fixtures/diagnostic/baseline-diagnostic-fixtures.json >/dev/null
          python3 -m json.tool migration-fixtures/rulepack/rulepack-and-redaction-fixtures.json >/dev/null
          python3 -m json.tool migration-fixtures/ocr/ocr-text-fixtures.json >/dev/null

      - name: Architecture guard self-test
        shell: bash
        run: bash scripts/verify-kmp-common-boundary.sh --self-test

      - name: Architecture guard repository scan
        shell: bash
        run: bash scripts/verify-kmp-common-boundary.sh

      - name: Run deterministic I0 baseline and I5 cutover tests
        shell: bash
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.DeterministicDiagnosticEngineTest' \
            --tests 'com.example.RulePackManagementTest' \
            --tests 'com.example.RulePackBoundaryTest' \
            --tests 'com.example.OcrLogExtractorTest' \
            --tests 'com.example.AndroidSharedCutoverIntegrationTest' \
            --stacktrace

      - name: Generate ephemeral Android debug keystore
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Assemble I5 physical-smoke APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace
          sha256sum app/build/outputs/apk/debug/app-debug.apk \
            | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload I5 physical-smoke APK
        uses: actions/upload-artifact@v7
        with:
          name: paniclab-i5-physical-smoke-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kmp-i0-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
