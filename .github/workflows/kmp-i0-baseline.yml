name: KMP I0 Baseline Verification

on:
  push:
    branches:
      - 'kmp/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kmp-i0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline fixtures and architecture guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Validate frozen JSON fixtures
        shell: bash
        run: |
          python3 -m json.tool migration-fixtures/diagnostic/baseline-diagnostic-fixtures.json >/dev/null
          python3 -m json.tool migration-fixtures/rulepack/rulepack-and-redaction-fixtures.json >/dev/null
          python3 -m json.tool migration-fixtures/ocr/ocr-text-fixtures.json >/dev/null

      - name: Architecture guard self-test
        shell: bash
        run: bash scripts/verify-kmp-common-boundary.sh --self-test

      - name: Architecture guard repository scan
        shell: bash
        run: bash scripts/verify-kmp-common-boundary.sh

      - name: Run deterministic I0 baseline tests
        shell: bash
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.DeterministicDiagnosticEngineTest' \
            --tests 'com.example.RulePackManagementTest' \
            --tests 'com.example.OcrLogExtractorTest' \
            --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kmp-i0-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7
